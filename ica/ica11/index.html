<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>A Silly Story</title>

    <style>
        body {
            font-family: "Helvetica", Arial, sans-serif;
            background-color: #f3f3f3;
            color: #000;
            margin: 30px;
            padding: 20px;
            text-align: center;
            line-height: 1.6;
        }

        div {
            margin: 20px auto;
            padding: 15px;
        }

        label {
            font-size: 16px;
            font-weight: bold;
            color: #315477;
            margin: 5px;
        }

        input {
            padding: 10px;
            margin: 8px;
            border: 1px solid #9ba1a6;
            border-radius: 0px;
            font-size: 15px;
        }

        fieldset {
            margin: 20px auto;
            padding: 20px;
            max-width: 400px;
            border: 2px solid #3498db;
            border-radius: 0px;
            background-color: #ffffff;
        }

        legend {
            font-size: 18px;
            font-weight: bold;
            color: #2c89c7;
            padding: 5px;
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 0px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }

        p {
            background-color: #ffffff;
            color: #334a61;
            max-width: 600px;
            margin: 25px auto;
            padding: 20px;
            border: 1px solid #b8c4ce;
            border-radius: 0px;
            font-size: 18px;
            line-height: 1.8;
            text-align: left;
        }
    </style>
  </head>

  <body>

    <div>
        <label for="custom-name">Enter custom name:</label>
        <input id="custom-name" type="text" placeholder="" />
    </div>
        <fieldset>
            <legend>Choose locale:</legend>
            <label for="us">US</label
            ><input id="us" type="radio" name="uk-us" value="us" checked />
            <label for="uk">UK</label
            ><input id="uk" type="radio" name="uk-us" value="uk" />
        </fieldset>
    <div>
        <button class="generate">Generate random story</button>
    </div>
<!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
    
    <p class="story"></p>


    <script>
        // Complete variable definitions and random functions

        const customName = document.getElementById("custom-name");
        const generateBtn = document.querySelector(".generate");
        const story = document.querySelector(".story");

        function randomValueFromArray(array) {
            const random = Math.floor(Math.random() * array.length);
            return array[random];
        }

        // Raw text strings
        const characters = ["Big-Boned Billy", "Plus-Sized Pablo", "Full-Figured Finley"];
        const places = ["the five-star resort", "the neighborhood pool", "the water park"];
        const events = ["he got pushed into the pool by fifteen children", "he jumped into the water to cool off", "he dropped his food into the pool and had to dive in to save it"];

        // Willy the Goblin
        // Big Daddy
        // Father Christmas

        // the soup kitchen
        // Disneyland
        // the White House

        // spontaneously combusted
        // melted into a puddle on the sidewalk
        // turned into a slug and slithered away

        // Partial return random string function

        function returnRandomStoryString() {
            // It was 94 Fahrenheit outside, so :insertx: went for a walk. When they got to :inserty:, they stared in horror for a few moments, then :insertz:. Bob saw the whole thing, but was not surprised — :insertx: weighs 300 pounds, and it was a hot day.

            const randomCharacter = randomValueFromArray(characters);
            const randomPlace = randomValueFromArray(places);
            const randomEvent = randomValueFromArray(events);

            let storyText = `It was 94 Fahrenheit outside, so ${randomCharacter} went to the pool with friends. When they all got to ${randomPlace}, he ate a burger while his friends relaxed in the water for a few minutes. Then, ${randomEvent}. Bob got splashed even though he was sitting far from the water, but he was not surprised — ${randomCharacter} weighs 300 pounds, and when he jumps into the water, it's like a megatsunami.`;

            return storyText;
        }


        // Event listener and partial generate function definition

        generateBtn.addEventListener("click", generateStory);

        function generateStory() {

            let newStory = returnRandomStoryString();

            if (customName.value !== "") {
                const name = customName.value;
                newStory = newStory.replace("Bob", name);
            }

            if (document.getElementById("uk").checked) {
                const weight = Math.round(300 / 14) + " stone";
                const temperature = Math.round((94 - 32) * 5 / 9) + " Celsius";

                newStory = newStory.replace("300 pounds", weight);
                newStory = newStory.replace("94 Fahrenheit", temperature);
            }

            console.log(newStory);
            // TODO: replace "" with the correct expression
            story.textContent = newStory;
            story.style.visibility = "visible";
        }
    </script>    
  </body>
</html>
